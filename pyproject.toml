[project]
name = "lk-prices"
version = "0.1.0"
description = "Ten years of Sri Lankan food prices from the Central Bank's Daily Price Reports, as Delta Lake tables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deltalake>=1.6.6",
    "pdfplumber>=0.11.10",
    "polars>=2.0.0",
    "pypdfium2>=5.14.0",
]

[project.scripts]
lk-prices = "lk_prices.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lk_prices"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
